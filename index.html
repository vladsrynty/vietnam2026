<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vietnam 2026 Itinerary & Budget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --accent: #10b981;
      --border-color: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif, system-ui, -apple-system;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 3rem;
    }

    header {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      padding: 2.5rem 1.5rem 2rem;
      text-align: center;
      box-shadow: var(--shadow);
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 1.5rem;
    }

    .header-stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .stat-badge {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .stat-badge b {
      font-weight: 700;
    }

    nav[role="tablist"] {
      display: flex;
      justify-content: center;
      background: white;
      border-bottom: 1px solid var(--border-color);
      gap: 0.5rem;
      padding: 0 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05);
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 1rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--primary);
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    main {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }

    .route-banner {
      font-size: 1.05rem;
      font-weight: 600;
      text-align: center;
      background: #e0f2fe;
      color: #0369a1;
      padding: 1rem;
      border-radius: var(--radius);
      margin-bottom: 2rem;
      border: 1px solid #bae6fd;
    }

    .timeline-item {
      display: flex;
      gap: 1.25rem;
      padding-bottom: 1.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .timeline-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }

    .timeline-date {
      min-width: 110px;
      font-weight: 700;
      color: var(--primary-dark);
      font-size: 1rem;
    }

    .timeline-content h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .timeline-content ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .timeline-content li {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    h3.section-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--text-main);
    }

    ul.styled-list {
      list-style-type: disc;
      padding-left: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    ul.styled-list li strong {
      color: var(--text-main);
    }

    .info-box {
      background: #f1f5f9;
      border-left: 4px solid var(--primary);
      padding: 1rem;
      border-radius: 0 var(--radius) var(--radius) 0;
      margin-bottom: 1rem;
    }

    .info-box h4 {
      font-size: 1rem;
      margin-bottom: 0.35rem;
      color: var(--text-main);
    }

    /* Budget Table Styling */
    .budget-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    .budget-table th, .budget-table td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .budget-table th {
      background: #f8fafc;
      font-weight: 600;
      color: var(--text-main);
    }

    .budget-table tr:last-child td {
      border-bottom: none;
      font-weight: 700;
      background: #f1f5f9;
    }

    footer {
      text-align: center;
      margin-top: 4rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    @media (max-width: 640px) {
      header h1 {
        font-size: 1.75rem;
      }
      .timeline-item {
        flex-direction: column;
        gap: 0.25rem;
      }
